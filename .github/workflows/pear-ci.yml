name: Pear CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build TypeScript + Bare linux-x64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Compile harness + plugins
        run: npm run build:ts

      - name: Lint TypeScript
        run: npm run lint

      - name: Test harness (SDD/TDD)
        run: npm test

      - name: Build linux-x64 binary
        run: npm run make:linux-x64

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: pearledger-linux-x64
          path: out/linux-x64/
          if-no-files-found: warn

  stage:
    name: Stage pear:// release
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Pear CLI
        run: curl -fsSL https://install.pears.com/pear.sh | sh

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build:ts

      - name: Stage and provision (alpha)
        env:
          PEAR_PRIMARY_KEY: ${{ secrets.PEAR_PRIMARY_KEY }}
        run: |
          if [ -z "$PEAR_PRIMARY_KEY" ]; then
            echo "::warning::PEAR_PRIMARY_KEY not set — skipping pear stage/provision"
            echo "Configure GitHub secret PEAR_PRIMARY_KEY for stable pear:// link"
            exit 0
          fi
          export PATH="$HOME/.local/bin:$PATH"
          npm run make:linux-x64
          PEAR_LINK=$(node -p "require('./package.json').upgrade")
          pear stage "$PEAR_LINK" --ignore node_modules,.git,out,dist,.storage-demo,vendor
          pear info "$PEAR_LINK"
          echo "Release staged on channel alpha (see pear info for verlinks)"

      - name: Verify upgrade link
        run: |
          node -e "
            const pkg = require('./package.json');
            if (pkg.upgrade.includes('YOUR_KEY')) {
              console.log('::warning::Replace pear:// key after pear touch locally');
              process.exit(0);
            }
            console.log('upgrade link:', pkg.upgrade);
          "
