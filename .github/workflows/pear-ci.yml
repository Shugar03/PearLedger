name: Pear CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pear-ci
  cancel-in-progress: false

jobs:
  build:
    name: Build TypeScript + Bare linux-x64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Compile harness + plugins
        run: npm run build:ts

      - name: Lint TypeScript
        run: npm run lint

      - name: Test harness (SDD/TDD)
        run: npm test

      - name: Build linux-x64 binary
        run: npm run make:linux-x64

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: pearledger-linux-x64
          path: out/linux-x64/
          if-no-files-found: warn

  stage:
    name: Stage pear:// release
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build:ts

      - name: Download linux-x64 binary
        uses: actions/download-artifact@v4
        with:
          name: pearledger-linux-x64
          path: out/linux-x64/

      - name: Prepare pear-stage (A1 — sin .git/tests)
        run: npm run pear:stage:prepare

      - name: Stage with pear-ci
        uses: holepunchto/actions/pear-ci@main
        with:
          primary-key: ${{ secrets.PEAR_PRIMARY_KEY }}
          namespace: pearledger
          target: pear-stage
          dry-run: false

      - name: Verify upgrade link
        run: |
          node -e "
            const pkg = require('./package.json');
            console.log('upgrade link:', pkg.upgrade);
          "
